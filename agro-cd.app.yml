apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: complete-devops-project
  namespace: argocd

spec:
  project: default

  source:
    repoURL: "https://github.com/Prezido29/Fully-Automated-DevOps-Pipeline-from-Scratch"
    targetRevision: HEAD
    path: complete-dev-project

  destination:
    server: https://kubernetes.default.svc
    namespace: flask-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true